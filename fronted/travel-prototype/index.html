<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Shared Ledger</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="refinements.css">
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="map.css">
  <link rel="stylesheet" href="connected.css">
  <link rel="stylesheet" href="mobile.css?v=6">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="atlas.css?v=3">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#itinerary" aria-label="返回行程"><img src="assets/ledger.png" alt="账本图标"></a>

    <nav aria-label="主导航">
      <button data-view="itinerary" class="nav-item active"><img class="nav-ledger-icon" src="assets/itinerary.png" alt="">Itinerary</button>
      <button data-view="ledger" class="nav-item"><img class="nav-ledger-icon" src="assets/ledger.png" alt="">Ledger</button>
      <button data-view="media" class="nav-item"><img class="nav-ledger-icon" src="assets/gallery.png" alt="">Gallery</button>
    </nav>
    <div class="side-trip" hidden></div>
    <button class="agent-entry" data-action="agent"><img src="assets/assistant.png" alt="规划助手头像"><span>行程助手</span><b>↗</b></button>
    <div class="prototype-note">尚未登录</div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb"><strong>Trips</strong></div><div class="top-actions"><span class="avatars" aria-label="同行者" hidden><i>我</i><i>林</i><i>陈</i><i>余</i></span><button class="quiet" data-action="export">↗ 导出行程</button></div></header>
    <main>
      <div class="page-heading"><div><span class="eyebrow" id="page-kicker">ITINERARY</span><h1 id="page-title">我的行程</h1><p id="page-subtitle"></p></div><span class="trip-stamp" hidden></span></div>
      <div class="content-grid">
        <section id="primary" aria-label="旅行内容"></section>
        <aside class="context-panel">
          <section class="export-stage" aria-label="行程导出预览">
            <div class="export-heading"><span class="eyebrow">EXPORT</span><h2>行程单</h2><p>完整行程 · PDF / 打印</p></div>
            <div class="paper-stack"><div class="back-paper back-paper-far"></div><div class="back-paper"></div><button class="preview-paper" data-action="export" aria-label="展开正视行程导出预览"><div id="paper-preview"></div></button></div>
            <button class="export-link" data-action="export">预览与导出 <span>↗</span></button>
          </section>
          <section class="companion"><div class="companion-head"><img src="assets/assistant.png" alt="规划助手头像"><div><strong>行程助手</strong></div><span class="tiny-tag">轻量规划</span></div><button class="wide-link" data-action="agent">规划偏好 <span>↗</span></button></section>

        </aside>
      </div>
    </main>
  </div>
  <dialog id="export-dialog" aria-labelledby="export-title"><header class="dialog-head"><div><span class="eyebrow">EXPORT</span><h2 id="export-title">行程单</h2></div><button data-close="export-dialog" class="icon-button" aria-label="关闭预览">×</button></header><div id="export-document" class="document"></div><div class="dialog-actions"><p>打印窗口中可选择“另存为 PDF”</p><button class="primary-button" data-action="print">打印 / 保存 PDF ↗</button></div></dialog>
  <dialog id="activity-dialog" aria-labelledby="activity-title"><header class="dialog-head"><h2 id="activity-title">加一张行程卡</h2><button data-close="activity-dialog" class="icon-button" aria-label="关闭行程编辑">×</button></header><form id="activity-form"><label>地点 / 活动<input name="title" maxlength="40" required></label><div class="form-grid"><label>开始时间<input name="time" type="time" required></label><label>停留分钟<input name="duration" type="number" min="15" max="600" required value="60"></label></div><label>随手记<input name="note" maxlength="100" placeholder="例如：提前预约，记得带证件"></label><p class="form-note">地点坐标用于路线生成，无需当前位置。手动安排可先保存，补充地点后再生成路线。</p><button class="primary-button" type="submit">保存安排</button><p id="activity-error" role="alert"></p></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="api.js"></script>
  <script src="amounts.js"></script>
  <script src="schedule.js?v=6"></script>
  <script src="trip-push.js?v=1"></script>
  <script src="trip-sync.js?v=1"></script>
  <script src="collaboration.js?v=1"></script>
  <script src="map-config.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="atlas-tools.js?v=1"></script>
  <script src="atlas.js?v=3"></script>
  <script src="connected.js?v=10"></script>
</body>
</html>
