spring.application.name=trip-ledger
# Local runs default to dev. Production must set SPRING_PROFILES_ACTIVE=prod
# or pass --spring.profiles.active=prod when starting the jar.
spring.profiles.default=dev
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.hikari.pool-name=TripLedgerHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.rabbitmq.host=${TRIP_LEDGER_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${TRIP_LEDGER_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${TRIP_LEDGER_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${TRIP_LEDGER_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2

spring.data.redis.host=${TRIP_LEDGER_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${TRIP_LEDGER_REDIS_PORT:6379}
spring.data.redis.password=${TRIP_LEDGER_REDIS_PASSWORD:}
spring.data.redis.timeout=2s

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.cache-enabled=false
mybatis-plus.configuration.default-enum-type-handler=com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.auth.enabled=true
app.auth.token-prefix=Bearer
app.auth.header-name=Authorization
app.auth.jwt-issuer=${spring.application.name}
app.auth.access-token-expire-seconds=7200
app.auth.bind-token-expire-seconds=600
app.auth.refresh-token-expire-seconds=604800
app.auth.jwt-secret=${TRIP_LEDGER_AUTH_JWT_SECRET:${TRIP_LEDGER_JWT_SECRET:}}
app.auth.exclude-paths=/api/v1/health,/api/v1/auth/wechat-login,/api/v1/auth/refresh-token,/api/v1/auth/dev/mock-users,/error
app.auth.bind-mobile-paths=/api/v1/auth/bind-wechat-mobile,/api/v1/files/upload

app.wechat.mini-program.mock-enabled=false
app.wechat.mini-program.manual-mobile-enabled=${TRIP_LEDGER_WECHAT_MANUAL_MOBILE_ENABLED:false}
app.wechat.mini-program.app-id=${TRIP_LEDGER_WECHAT_APP_ID:${TRIP_LEDGER_WECHAT_MP_APP_ID:}}
app.wechat.mini-program.app-secret=${TRIP_LEDGER_WECHAT_APP_SECRET:${TRIP_LEDGER_WECHAT_MP_APP_SECRET:}}
app.wechat.mini-program.code2-session-url=https://api.weixin.qq.com/sns/jscode2session
app.wechat.mini-program.stable-access-token-url=https://api.weixin.qq.com/cgi-bin/stable_token
app.wechat.mini-program.get-phone-number-url=https://api.weixin.qq.com/wxa/business/getuserphonenumber

app.cors.path-pattern=/api/**
app.cors.allowed-origin-patterns=${TRIP_LEDGER_CORS_ALLOWED_ORIGIN_PATTERNS:}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Idempotency-Key
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true
app.cors.max-age-seconds=3600

app.file-storage.base-dir=${TRIP_LEDGER_FILE_BASE_DIR:../../files}
app.file-storage.public-base-url=${TRIP_LEDGER_PUBLIC_BASE_URL:}
app.file-storage.avatar-dir=avatar
app.file-storage.cover-dir=cover
app.file-storage.billing-dir=billing
app.file-storage.max-upload-bytes=10485760
app.file-storage.avatar-target-bytes=1048576
app.file-storage.cover-target-bytes=1048576
app.file-storage.billing-target-bytes=3145728

app.rabbitmq.export-exchange=trip-ledger.export.exchange
app.rabbitmq.export-routing-key=trip-ledger.export.created
app.rabbitmq.export-queue=trip-ledger.export.queue

app.redis.lock-prefix=trip-ledger:lock:
app.redis.idempotency-prefix=trip-ledger:idempotency:

logging.level.root=INFO
logging.level.com.spvermicelli.tripledger=INFO

# Identify this deployment to the public geocoder; configure a contact address in production.
app.travel.osm-user-agent=${TRIP_LEDGER_OSM_USER_AGENT:TripLedger/0.1 (local development)}

# Outbox publisher must distinguish confirmation from unroutable returns.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Management traffic stays on a separate loopback listener; never proxy it publicly.
management.server.port=${TRIP_LEDGER_MANAGEMENT_PORT:9091}
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=trip-ledger
