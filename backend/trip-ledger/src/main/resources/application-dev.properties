server.port=${TRIP_LEDGER_SERVER_PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${TRIP_LEDGER_DB_URL:jdbc:mysql://127.0.0.1:3306/db_trip_ledger?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${TRIP_LEDGER_DB_USER:${TRIP_LEDGER_DB_USERNAME:ledger_admin}}
spring.datasource.password=${TRIP_LEDGER_DB_PASSWORD}

app.auth.enabled=true
app.auth.jwt-secret=${TRIP_LEDGER_AUTH_JWT_SECRET:${TRIP_LEDGER_JWT_SECRET}}
app.auth.access-token-expire-seconds=60
app.auth.refresh-token-expire-seconds=600
app.wechat.mini-program.mock-enabled=true
app.wechat.mini-program.manual-mobile-enabled=${TRIP_LEDGER_WECHAT_MANUAL_MOBILE_ENABLED:true}
app.wechat.mini-program.app-id=${TRIP_LEDGER_WECHAT_APP_ID:${TRIP_LEDGER_WECHAT_MP_APP_ID:}}
app.wechat.mini-program.app-secret=${TRIP_LEDGER_WECHAT_APP_SECRET:${TRIP_LEDGER_WECHAT_MP_APP_SECRET:}}

app.cors.allowed-origin-patterns=http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,http://127.0.0.1:4173,http://localhost:4174,http://127.0.0.1:4174,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,https://spvermicelli.com,https://*.spvermicelli.com
