server.port=${TRIP_LEDGER_SERVER_PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${TRIP_LEDGER_DB_URL}
spring.datasource.username=${TRIP_LEDGER_DB_USER:${TRIP_LEDGER_DB_USERNAME}}
spring.datasource.password=${TRIP_LEDGER_DB_PASSWORD}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.initialization-fail-timeout=1

app.auth.enabled=true
app.auth.jwt-secret=${TRIP_LEDGER_AUTH_JWT_SECRET:${TRIP_LEDGER_JWT_SECRET}}
app.wechat.mini-program.mock-enabled=false
app.wechat.mini-program.manual-mobile-enabled=${TRIP_LEDGER_WECHAT_MANUAL_MOBILE_ENABLED:false}
app.wechat.mini-program.app-id=${TRIP_LEDGER_WECHAT_APP_ID:${TRIP_LEDGER_WECHAT_MP_APP_ID}}
app.wechat.mini-program.app-secret=${TRIP_LEDGER_WECHAT_APP_SECRET:${TRIP_LEDGER_WECHAT_MP_APP_SECRET}}

app.cors.allowed-origin-patterns=${TRIP_LEDGER_CORS_ALLOWED_ORIGIN_PATTERNS}
app.file-storage.base-dir=${TRIP_LEDGER_FILE_BASE_DIR}
app.file-storage.public-base-url=${TRIP_LEDGER_PUBLIC_BASE_URL}
