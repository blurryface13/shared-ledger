# Integration tests require a reachable MySQL database.
# Default values match sql/.env.test.example; override with TRIP_LEDGER_TEST_DB_* when needed.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${TRIP_LEDGER_TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/db_trip_ledger?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${TRIP_LEDGER_TEST_DB_USERNAME:root}
spring.datasource.password=${TRIP_LEDGER_TEST_DB_PASSWORD:root123456}

app.auth.enabled=false
app.auth.jwt-secret=TripLedgerTestJwtSecretKeyTripLedgerTest2026
app.wechat.mini-program.mock-enabled=true
app.wechat.mini-program.manual-mobile-enabled=true
app.cors.allowed-origin-patterns=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

logging.level.com.spvermicelli.tripledger=DEBUG

# Integration tests drive the relay explicitly.
app.export.outbox.enabled=false

management.server.port=-1
